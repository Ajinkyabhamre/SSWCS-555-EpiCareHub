version: "3.8"

services:
  # Backend - Node/Express API
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: epicarehub-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    environment:
      # Override with Docker-specific URLs (container-to-container)
      - PYTHON_API_URL=http://brain-api:8000
      - NODE_API_URL=http://backend:3000
      # All other env vars loaded from .env file
    depends_on:
      - brain-api
    networks:
      - epicarehub-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Brain API - Python/FastAPI for EEG processing
  brain-api:
    build:
      context: ./Localization-Algorithm
      dockerfile: Dockerfile
    container_name: epicarehub-brain-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      # Python-specific runtime settings
      - PYTHONUNBUFFERED=1
      - KMP_DUPLICATE_LIB_OK=TRUE
      - MPLBACKEND=Agg
      - UPLOADS_DIR=/app/uploads
      # Override with Docker-specific URL (container-to-container)
      - NODE_API_URL=http://backend:3000
      # All other env vars (Cloudinary, API keys, etc.) loaded from .env file
      # Note: Removed PYVISTA_OFF_SCREEN and MNE_3D_BACKEND - no longer using pyvista
      # MNE uses matplotlib backend (Agg) for headless rendering
    volumes:
      # Persist uploads (optional - can use cloud storage instead)
      - brain-uploads:/app/uploads
    networks:
      - epicarehub-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import requests; requests.get('http://localhost:8000/health').raise_for_status()",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  # Frontend - React/Vite app served by Nginx
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_PYTHON_API_URL: ${VITE_PYTHON_API_URL}
        VITE_EPICARE_DEV_MODE: ${VITE_EPICARE_DEV_MODE}
        VITE_ENABLE_WEBGL_BRAIN: ${VITE_ENABLE_WEBGL_BRAIN}
    container_name: epicarehub-frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - epicarehub-network
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  epicarehub-network:
    driver: bridge

volumes:
  brain-uploads:
    driver: local
