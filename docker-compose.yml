version: '3.8'

services:
  # Backend - Node/Express API
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: epicarehub-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      # MongoDB (cloud-hosted - Atlas or remote instance)
      - MONGO_URL=${MONGO_URL}
      # Cloudinary (cloud-hosted)
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      # Brain API service (Docker network)
      - BRAIN_API_URL=http://brain-api:8000
      - FASTAPI_URL=http://brain-api:8000
      # Session secret
      - SESSION_SECRET=${SESSION_SECRET:-epicarehub-secret-key-change-in-production}
    depends_on:
      - brain-api
    networks:
      - epicarehub-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Brain API - Python/FastAPI for EEG processing
  brain-api:
    build:
      context: ./Localization-Algorithm
      dockerfile: Dockerfile
    container_name: epicarehub-brain-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - KMP_DUPLICATE_LIB_OK=TRUE
      - MPLBACKEND=Agg
      - BASE_PATH=/app/uploads
      # Node backend URL for callbacks
      - NODE_API_URL=http://backend:3000
      - EPICARE_INTERNAL_API_KEY=${EPICARE_INTERNAL_API_KEY:-internal-api-key}
    volumes:
      # Persist uploads (optional - can use cloud storage instead)
      - brain-uploads:/app/uploads
    networks:
      - epicarehub-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  # Frontend - React/Vite app served by Nginx
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:3000
    container_name: epicarehub-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - epicarehub-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  epicarehub-network:
    driver: bridge

volumes:
  brain-uploads:
    driver: local
