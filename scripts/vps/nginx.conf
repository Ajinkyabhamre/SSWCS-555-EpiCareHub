# EpiCareHub - Nginx Reverse Proxy Configuration for VPS
# Place in: /etc/nginx/sites-available/epicarehub
# Symlink to: /etc/nginx/sites-enabled/epicarehub

# Upstream servers (Docker containers)
upstream backend {
    server localhost:3000;
}

upstream brain_api {
    server localhost:8000;
}

upstream frontend {
    server localhost:5173;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name epicarehub.com www.epicarehub.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name epicarehub.com www.epicarehub.com;

    # SSL certificates (Certbot will auto-configure these)
    # ssl_certificate /etc/letsencrypt/live/epicarehub.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/epicarehub.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upload size limits (for EEG files up to 500MB)
    client_max_body_size 500M;
    client_body_timeout 300s;

    # Timeouts for long-running ML requests
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Backend API (Node.js Express)
    location /api/ {
        proxy_pass http://backend/;
        proxy_http_version 1.1;

        # WebSocket support (if needed for future features)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Don't cache API responses
        proxy_cache_bypass $http_upgrade;
    }

    # Brain API (Python FastAPI)
    location /brain/ {
        proxy_pass http://brain_api/;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Important: Don't cache ML responses (they're study-specific)
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache 1;

        # Extended timeout for ML processing (up to 5 minutes)
        proxy_read_timeout 300s;
    }

    # Frontend (React SPA served by Nginx in container, or static files)
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SPA fallback (handle client-side routing)
        # If frontend container uses nginx, it should handle this internally
        # Otherwise uncomment:
        # try_files $uri $uri/ /index.html;
    }

    # Health checks (don't log these to reduce noise)
    location ~ ^/(health|api/health|brain/health)$ {
        access_log off;
        proxy_pass http://backend;
    }

    # Static assets caching (if serving directly)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

